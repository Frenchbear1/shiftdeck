<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#17191d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #17191d;
        color-scheme: dark;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f5f7;
        color-scheme: light;
      }
    </style>
    <script>
      try {
        const activeTheme =
          localStorage.getItem("shiftdeck.theme") === "dark" ? "dark" : "light";
        const themeColor = activeTheme === "dark" ? "#17191d" : "#f4f5f7";
        document.documentElement.dataset.theme = activeTheme;
        document.documentElement.style.colorScheme = activeTheme;
        document.documentElement.style.backgroundColor = themeColor;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", themeColor);
        document
          .querySelector(
            'meta[name="apple-mobile-web-app-status-bar-style"]',
          )
          ?.setAttribute(
            "content",
            activeTheme === "dark" ? "black-translucent" : "default",
          );
      } catch (error) {}
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register(new URL("sw.js", document.baseURI).href, {
            scope: new URL("./", document.baseURI).pathname,
          })
          .catch(() => {});
      }
      // A Home Screen app coming back from the background keeps running the version it started
      // with (an iPhone can keep it for days). Back after a while, it looks for a newer version
      // and reloads into it, so fixes and new kinds of sync reach every device without a force-close.
      (() => {
        let hiddenAt = 0;
        const current = () => {
          const script = document.querySelector('script[type="module"][src*="assets/"]');
          return script ? new URL(script.getAttribute("src"), document.baseURI).pathname : "";
        };
        const check = () => {
          const mine = current();
          if (!mine) return;
          fetch(new URL("./", document.baseURI).href, { cache: "no-store" })
            .then((response) => (response.ok ? response.text() : ""))
            .then((html) => {
              const match = /<script[^>]*type="module"[^>]*src="([^"]*assets\/[^"]+)"/.exec(html);
              if (!match) return;
              const latest = new URL(match[1], document.baseURI).pathname;
              if (latest !== mine && document.visibilityState === "visible") location.reload();
            })
            .catch(() => {});
        };
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") hiddenAt = Date.now();
          else if (hiddenAt && Date.now() - hiddenAt > 20000) check();
        });
        // Left open on screen a long time: look every 30 minutes.
        setInterval(() => {
          if (document.visibilityState === "visible") check();
        }, 30 * 60 * 1000);
      })();
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Shiftdeck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
